<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gallery — sabrina081476</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="page-header">
    <h1 class="site-title small"><a href="/">sabrina081476</a></h1>
    <nav class="page-nav">
      <a class="side-link" href="/">home</a>
      <span class="page-title">gallery</span>
      <a class="side-link" href="/posts">posts</a>
    </nav>
  </header>

  <main class="gallery-grid" id="gallery-grid"></main>

  <script src="gallery.js"></script>
  <script>
    const grid = document.getElementById("gallery-grid");
    for (const id of (typeof VIDEOS !== "undefined" ? VIDEOS : [])) {
      const tile = document.createElement("div");
      tile.className = "video-tile";

      const facade = document.createElement("button");
      facade.type = "button";
      facade.className = "video-facade";
      facade.setAttribute("aria-label", "Play video");

      const thumb = document.createElement("img");
      thumb.src = "https://img.youtube.com/vi/" + id + "/maxresdefault.jpg";
      thumb.onerror = () => { thumb.onerror = null; thumb.src = "https://img.youtube.com/vi/" + id + "/hqdefault.jpg"; };
      thumb.alt = "video thumbnail";

      const play = document.createElement("span");
      play.className = "video-play";

      facade.appendChild(thumb);
      facade.appendChild(play);
      facade.addEventListener("click", () => {
        const iframe = document.createElement("iframe");
        iframe.className = "video-frame";
        iframe.src = "https://www.youtube.com/embed/" + id + "?autoplay=1";
        iframe.title = "YouTube video";
        iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
        iframe.allowFullscreen = true;
        tile.replaceChildren(iframe);
      });

      tile.appendChild(facade);
      grid.appendChild(tile);
    }
    for (const filename of GALLERY) {
      const link = document.createElement("a");
      link.href = "images/gallery/" + encodeURIComponent(filename);
      const img = document.createElement("img");
      img.src = "images/gallery-thumbs/" + encodeURIComponent(filename);
      img.alt = filename.replace(/\.[^.]+$/, "");
      link.appendChild(img);
      grid.appendChild(link);
    }
  </script>
</body>
</html>
