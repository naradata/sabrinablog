  <main class="gallery-grid" id="gallery-grid"></main>

  <script src="gallery.js"></script>
  <script>
    const grid = document.getElementById("gallery-grid");
    for (const filename of GALLERY) {
      const link = document.createElement("a");
      link.href = "images/gallery/" + encodeURIComponent(filename);
      const img = document.createElement("img");
      img.src = "images/gallery-thumbs/" + encodeURIComponent(filename);
      img.alt = filename.replace(/\.[^.]+$/, "");
      link.appendChild(img);
      grid.appendChild(link);
    }
  </script>
