<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>posts — sabrina081476</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="page-header">
    <h1 class="site-title small"><a href="/">sabrina081476</a></h1>
    <nav class="page-nav">
      <a class="side-link" href="/">home</a>
      <span class="page-title">posts</span>
      <a class="side-link" href="/gallery">gallery</a>
    </nav>
  </header>

  <main class="post-list" id="post-list"></main>

  <script src="posts.js"></script>
  <script>
    const list = document.getElementById("post-list");
    for (const post of POSTS) {
      const article = document.createElement("article");
      article.className = "post-preview";

      const headingRow = document.createElement("div");
      headingRow.className = "post-heading";
      const heading = document.createElement("h2");
      heading.className = "post-title";
      const toggle = document.createElement("a");
      toggle.href = "#";
      toggle.textContent = post.title;
      heading.appendChild(toggle);
      headingRow.appendChild(heading);

      const body = document.createElement("div");
      body.className = "post-body";
      body.hidden = true;

      const render = (text) => {
        body.textContent = "";
        for (const paragraph of text.trim().split(/\n\s*\n/)) {
          const p = document.createElement("p");
          p.textContent = paragraph;
          body.appendChild(p);
        }
      };
      render(post.body);

      toggle.addEventListener("click", (event) => {
        event.preventDefault();
        body.hidden = !body.hidden;
      });

      if (post.translation) {
        const translateButton = document.createElement("button");
        translateButton.type = "button";
        translateButton.className = "translate-btn";
        translateButton.textContent = "Перевести";
        let translated = false;
        translateButton.addEventListener("click", () => {
          translated = !translated;
          render(translated ? post.translation : post.body);
          translateButton.textContent = translated ? "English" : "Перевести";
          body.hidden = false;
        });
        headingRow.appendChild(translateButton);
      }

      article.appendChild(headingRow);
      article.appendChild(body);
      list.appendChild(article);
    }
  </script>
</body>
</html>
