<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>posts — sabrina081476</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="page-header">
    <h1 class="site-title small"><a href="/">sabrina081476</a></h1>
    <nav class="page-nav">
      <a class="side-link" href="/">home</a>
      <span class="page-title">posts</span>
      <a class="side-link" href="/gallery">gallery</a>
    </nav>
  </header>

  <main class="post-list" id="post-list"></main>

  <script src="posts.js"></script>
  <script>
    const list = document.getElementById("post-list");
    for (const post of POSTS) {
      const article = document.createElement("article");
      article.className = "post-preview";

      const heading = document.createElement("h2");
      heading.className = "post-title";
      const toggle = document.createElement("a");
      toggle.href = "#";
      toggle.textContent = post.title;
      heading.appendChild(toggle);

      const body = document.createElement("div");
      body.className = "post-body";
      body.hidden = true;
      for (const paragraph of post.body.trim().split(/\n\s*\n/)) {
        const p = document.createElement("p");
        p.textContent = paragraph;
        body.appendChild(p);
      }

      toggle.addEventListener("click", (event) => {
        event.preventDefault();
        body.hidden = !body.hidden;
      });

      article.appendChild(heading);
      article.appendChild(body);
      list.appendChild(article);
    }
  </script>
</body>
</html>
